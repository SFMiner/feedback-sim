<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Feedback!</title>
		<style>
html, body {
	margin: 0;
	padding: 0;
	height: 100%;
	background-color: #0f1722;
	color: #f2f5f8;
	font-family: Arial, Helvetica, sans-serif;
}

body {
	overflow: hidden;
	touch-action: none;
}

main {
	position: relative;
	height: 100%;
}

#canvas {
	display: block;
	margin: 0;
	padding: 0;
	border: 0;
}

#canvas:focus {
	outline: none;
}

#canvas:focus-visible {
	outline: 4px solid #ffd84a;
	outline-offset: -4px;
}

.vh {
	position: absolute;
	width: 1px;
	height: 1px;
	margin: -1px;
	padding: 0;
	overflow: hidden;
	clip: rect(0, 0, 0, 0);
	white-space: nowrap;
	border: 0;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 12px;
	background-color: #0f1722;
	padding: 16px;
	text-align: center;
	font-size: 20px;
}

#status-progress {
	width: min(50%, 360px);
	height: 16px;
}

#status-notice {
	display: none;
	max-width: 36rem;
	padding: 16px;
	border: 2px solid #f2f5f8;
	background: #1a2633;
	line-height: 1.4;
}

@media (forced-colors: active) {
	#status-notice {
		border-color: CanvasText;
	}
	#canvas:focus-visible {
		outline-color: Highlight;
	}
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<main id="main">
			<h1 class="vh">Feedback!</h1>
			<canvas id="canvas" tabindex="0" aria-label="Feedback! game. Press Tab to reach the game's buttons. Press Escape to leave the game.">
				Your browser cannot show this game.
			</canvas>
			<noscript>
				<p>Feedback! needs JavaScript to run. Turn it on, or try another browser.</p>
			</noscript>
			<div id="status">
				<p id="status-text" role="status">Loading Feedback!...</p>
				<progress id="status-progress" aria-label="Loading progress"></progress>
				<div id="status-notice" role="alert"></div>
			</div>
		</main>
		<div id="fb-status" class="vh" role="status" aria-live="polite" aria-atomic="true"></div>
		<div id="fb-alert" class="vh" role="alert" aria-live="assertive" aria-atomic="true"></div>

		<script>
// Live regions the game writes to through JavaScriptBridge (scripts/ui/announcer.gd). Clearing first
// makes a repeated message announce again. Pattern reused from data-detectives' shell.
window.fbAnnounce = function (text, assertive) {
	const el = document.getElementById(assertive ? 'fb-alert' : 'fb-status');
	if (!el) {
		return;
	}
	el.textContent = '';
	window.setTimeout(function () {
		el.textContent = String(text);
	}, 50);
};
		</script>
		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;

(function () {
	const status = document.getElementById('status');
	const statusText = document.getElementById('status-text');
	const progress = document.getElementById('status-progress');
	const notice = document.getElementById('status-notice');

	// A readable message instead of a blank screen.
	function fail(text) {
		console.error(text);
		statusText.textContent = 'Feedback! could not start.';
		progress.style.display = 'none';
		notice.textContent = text;
		notice.style.display = 'block';
	}

	let missing = [];
	if (typeof WebAssembly !== 'object') {
		missing.push('WebAssembly');
	}
	if (typeof Engine === 'undefined') {
		fail('The game files did not load. Check the connection and reload the page.');
		return;
	}
	missing = missing.concat(Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED }));
	if (missing.length !== 0) {
		fail('This browser is missing something the game needs (' + missing.join(', ') + '). '
			+ 'Try an up-to-date Chrome, Edge or Firefox, or ask your teacher for help.');
		return;
	}
	const engine = new Engine(GODOT_CONFIG);
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				progress.value = current;
				progress.max = total;
			} else {
				progress.removeAttribute('value');
				progress.removeAttribute('max');
			}
		},
	}).then(function () {
		status.remove();
	}, function (err) {
		fail('Something went wrong while starting the game. Reload the page to try again. ('
			+ (err && err.message ? err.message : String(err)) + ')');
	});
}());
		</script>
	</body>
</html>
